# Hiệu ứng trong suốt
opacity-rule = [
    "95:class_g = 'Kitty' && focused",
    "85:class_g = 'Kitty' && !focused",
    "90:class_g = 'Cursor' && focused",
    "80:class_g = 'Cursor' && !focused"
];

# Hiệu ứng mờ
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-kern = "7x7box";
blur-strength = 5;

# Hiệu ứng fade
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Hiệu ứng mở cửa sổ
animations = true;
animation-window-mass = 0.5;
animation-for-open-window = "zoom";
animation-stiffness = 200;
animation-dampening = 20;
animation-clamping = true;

# Các hiệu ứng khác
# corner-radius = 10;
rounded-corners-exclude = [
    # Có thể xóa phần này nếu không dùng
    # "class_g = 'Polybar'"
];
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -5;
shadow-offset-y = -5;

# Thêm Polybar vào danh sách exclude
shadow-exclude = [
    "class_g = 'Polybar'",
    # Các ứng dụng khác nếu cần
    "class_g = 'Dunst'"
];
