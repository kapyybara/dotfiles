; Colors them
include-file = ~/.config/polybar/color.ini

; Modules folder
include-directory = ~/.config/polybar/modules

[bar/mybar]
width = 100%
height = 22pt
radius = 6
monitor = DP-2

; Thêm margin cho Polybar
margin-top = 4
margin-bottom = 4
margin-left = 4
margin-right = 4
border-size = 4
border-color = #00000000  ; Màu transparent

; dpi = 96

background = ${colors.base}
foreground = ${colors.text}

line-size = 4pt

padding-left = 0
padding-right = 2

module-margin = 2

separator = 
separator-foreground = ${colors.peach}

font-0 = JetBrainsMono Nerd Font:size=8;1

modules-left = i3 memory cpu 
modules-center = date
; modules-right = pulseaudio wlan eth systray
modules-right = pulseaudio wlan systray
 
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

override-redirect = false
; vim:ft=dosini
